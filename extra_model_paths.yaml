# EXTENDS (and replaces at COPY time) the worker's stock mapping — must contain
# ALL the stock entries: an earlier version had only the seedvr2 line and blanked
# every model list on the endpoint (validation saw `not in []`).
runpod_worker_comfy:
  base_path: /runpod-volume
  checkpoints: models/checkpoints/
  clip: models/clip/
  clip_vision: models/clip_vision/
  configs: models/configs/
  controlnet: models/controlnet/
  embeddings: models/embeddings/
  loras: models/loras/
  upscale_models: models/upscale_models/
  vae: models/vae/
  unet: models/unet/
  seedvr2: models/SEEDVR2/
